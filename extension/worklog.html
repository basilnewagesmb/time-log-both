<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Work Log</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="worklog.css">
</head>
<body>
  <a class="skip" href="#log-form">Skip to log form</a>

  <header class="topbar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="28" height="28">
      <div>
        <h1>Daily Work Log</h1>
        <p class="date" id="today-label"></p>
      </div>
    </div>
    <div class="user-actions">
      <div class="user" id="user" aria-busy="true">
        <span class="avatar skeleton" id="user-avatar" aria-hidden="true"></span>
        <span class="user-name skeleton-text" id="user-name">Loading…</span>
      </div>
    </div>
  </header>

  <div class="banner" id="signin-banner" role="alert" hidden>
    <span>You're not signed in to Jira. Open newagesmb.atlassian.net, sign in, then reload.</span>
    <div class="banner-actions">
      <button type="button" class="btn btn-primary" id="open-jira">Open Jira</button>
      <button type="button" class="btn btn-ghost" id="reload">Reload</button>
    </div>
  </div>

  <main class="layout">
    <form class="card" id="log-form" novalidate aria-labelledby="form-title">
      <h2 id="form-title">Log time</h2>

      <!-- Project -->
      <div class="field">
        <label for="project">Project</label>
        <div class="select-wrap" id="project-wrap" aria-busy="true">
          <select id="project" disabled>
            <option>Loading projects…</option>
          </select>
        </div>
      </div>

      <!-- Task -->
      <fieldset class="field task-section">
        <div class="task-head">
          <legend>Task</legend>
          <label class="toggle">
            <input type="checkbox" id="stories-only" checked>
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            <span>Stories &amp; subtasks</span>
          </label>
        </div>
        <input type="search" id="task-filter" class="input" placeholder="Filter by key or summary" aria-label="Filter tasks" autocomplete="off">
        <div class="task-list" id="task-list" role="radiogroup" aria-label="Tasks assigned to you" aria-busy="true"></div>
        <p class="hint" id="task-count" aria-live="polite"></p>
      </fieldset>

      <!-- Time -->
      <div class="field-row">
        <div class="field">
          <label for="hours">Hours</label>
          <input type="number" id="hours" class="input" min="0.25" max="24" step="0.25" value="1" required inputmode="decimal">
          <div class="chips" role="group" aria-label="Quick durations">
            <button type="button" class="chip" data-hours="0.25">15m</button>
            <button type="button" class="chip" data-hours="0.5">30m</button>
            <button type="button" class="chip" data-hours="1">1h</button>
            <button type="button" class="chip" data-hours="2">2h</button>
            <button type="button" class="chip" data-hours="4">4h</button>
          </div>
        </div>
        <div class="field">
          <label for="start">Started at</label>
          <input type="time" id="start" class="input" value="09:00" required>
        </div>
      </div>

      <!-- Note -->
      <div class="field">
        <label for="note">Note <span class="optional">(optional)</span></label>
        <textarea id="note" class="input" rows="3" placeholder="What did you work on?"></textarea>
      </div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="submit" disabled>
        <span class="btn-label">Log time</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <aside class="card today" aria-labelledby="today-title">
      <div class="today-head">
        <h2 id="today-title">Today</h2>
        <button type="button" class="icon-btn" id="refresh-today" aria-label="Refresh today's entries" title="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>

      <div class="progress-block">
        <div class="progress-label">
          <span id="total-label">0h logged</span>
          <span class="muted">of <span id="target-label">8h</span></span>
        </div>
        <div class="progress" role="progressbar" id="progress" aria-label="Hours logged today" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="sync">
        <span class="sync-status" id="sync-status" role="status" aria-live="polite">Team sheet connected</span>
        <button type="button" class="link-btn" id="sync-now">Sync now</button>
      </div>

      <ul class="entries" id="entries" aria-live="polite" aria-busy="true"></ul>
    </aside>
  </main>

  <div class="toasts" id="toasts" aria-live="assertive" aria-atomic="false"></div>

  <script src="jira.js"></script>
  <script src="sheet.js"></script>
  <script src="worklog.js"></script>
</body>
</html>
