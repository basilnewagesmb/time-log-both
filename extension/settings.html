<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Daily Work Log</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="worklog.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="28" height="28">
      <div>
        <h1>Settings</h1>
        <p class="date"><a href="worklog.html" class="back-link">← Back to Daily Work Log</a></p>
      </div>
    </div>
  </header>

  <main class="layout layout-single">
    <form class="card" id="settings-form" novalidate aria-labelledby="sheet-title">
      <h2 id="sheet-title">Google Sheet</h2>
      <p class="hint settings-intro">Each time you log time, your total for the day is written to the team sheet. Ask the sheet owner for the web app URL and token. They're saved in this browser only.</p>

      <div class="field">
        <label for="sheet-url">Web app URL</label>
        <input type="url" id="sheet-url" class="input" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="sheet-token">Token</label>
        <input type="password" id="sheet-token" class="input" autocomplete="off" spellcheck="false">
      </div>

      <p class="form-error" id="settings-error" role="alert" hidden></p>
      <p class="form-ok" id="settings-ok" role="status" hidden></p>

      <div class="settings-actions">
        <button type="submit" class="btn btn-primary" id="save"><span class="btn-label">Save &amp; test</span><span class="spinner" aria-hidden="true"></span></button>
        <button type="button" class="btn btn-ghost" id="clear">Disconnect</button>
      </div>
    </form>
  </main>

  <script src="sheet.js"></script>
  <script src="settings.js"></script>
</body>
</html>
